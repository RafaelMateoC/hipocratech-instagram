name: Publicar en Instagram

on:
  schedule:
    # 23:00 UTC = 7:00 PM en Republica Dominicana (UTC-4 todo el ano).
    # GitHub puede retrasar los cron bajo carga; no lo tomes como hora exacta.
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha a publicar (YYYY-MM-DD). Vacio = hoy."
        required: false
      simular:
        description: "Simular sin publicar"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisar vigencia del token
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
        run: python herramientas/revisar_token.py

      - name: Publicar
        id: publicar
        env:
          IG_CUENTA_ID: ${{ secrets.IG_CUENTA_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          URL_MEDIOS: ${{ vars.URL_MEDIOS }}
          FECHA: ${{ inputs.fecha }}
          SIMULAR: ${{ inputs.simular == true && '1' || '' }}
        run: |
          set +e
          python publicador/publicar.py | tee salida.txt
          codigo=${PIPESTATUS[0]}
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          # 78 = el dia esta en la agenda pero el arte no esta producida.
          # No es un fallo del sistema, pero tiene que verse en el resumen.
          if [ "$codigo" = "78" ]; then exit 0; fi
          exit $codigo

      - name: Guardar el registro de publicacion
        # Al simular no se publica nada, asi que no hay registro que guardar.
        if: steps.publicar.outputs.codigo == '0' && inputs.simular != true
        run: |
          if [ ! -f estado.json ]; then
            echo "Todavia no hay estado.json"
            exit 0
          fi
          git add estado.json
          if git diff --cached --quiet; then
            echo "Sin cambios en estado.json"
            exit 0
          fi
          git config user.name  "publicador-hipocratech"
          git config user.email "actions@github.com"
          git commit -m "Publicado $(date -u +%Y-%m-%d)"
          git push

      - name: Resumen
        if: always()
        run: |
          echo "## Publicacion del $(TZ=America/Santo_Domingo date +'%d/%m/%Y')" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat salida.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "sin salida" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
